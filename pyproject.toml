[project]
name = "dark-vessel-watch"
version = "0.1.0"
description = "Self-hosted streaming pipeline that detects suspicious ship behaviour from AIS data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clickhouse-connect>=0.8",
    "confluent-kafka>=2.16.1",
    "cramjam>=2.14.0",  # aiokafka uses it for lz4, which the replayer compresses ais.raw with
    "faust-streaming>=0.15.4,<0.16",  # app.py uses a private API; see test_app.py
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "packaging>=26.3",  # imported by faust-streaming but not declared by it
    "polars>=2.1.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "rocksdict>=0.3.29",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-pyyaml>=6.0.12.20261030",
]
