# Dark Vessel Watch – local stack
#
# Run from the repo root via the Makefile (it passes --env-file .env).
# Memory budget (mem_limit caps, not reservations) for the 3.9 GiB Docker VM:
#   redpanda 768m (512M Seastar memory + overhead) | clickhouse 1.25g | postgis 512m
#   raw-sink 384m | tracker 512m | alerts-sink 192m | vessels-sink 192m
#   flink-jobmanager 768m | flink-taskmanager 1280m        (profile flink, `make flink-up`)
#   total ≈ 5.8g ceiling; measured use with everything running is in the README
#   console 256m, only when needed (profile console, `make console`)
#   flink-submit 384m, one-shot; refdata-tools 1g, only while `make refdata` builds a package
#   Run GDAL package builds with Flink stopped.
# Every image tag is pinned; never use :latest (reproducibility).

name: dvw

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    container_name: dvw-redpanda
    # Advertised-listener split
    # -------------------------
    # A Kafka client connects to any bootstrap address, fetches cluster
    # metadata, and then reconnects to whatever address the broker *advertises*.
    # One address cannot work for both sides: "redpanda:9092" only resolves
    # inside the Docker network, and "localhost:19092" inside a container
    # points at the container itself. So we bind two named listeners:
    #   internal  0.0.0.0:9092  advertised as redpanda:9092   -> other containers
    #   external  0.0.0.0:19092 advertised as localhost:19092 -> host processes
    #                                                           (replayer, Faust, rpk on host)
    # The broker returns the advertised address of the listener the client
    # connected through, so each side only ever sees an address it can reach.
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API, external listener
      - "19644:9644"    # Admin API (rpk cluster ops from host)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    # 512M is Seastar's own memory; the rest is the process outside it. If Redpanda refuses
    # to start or logs memory pressure at 10x, raise --memory to 768M and this to 1g.
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy --watch=false | grep -qE 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  init-topics:
    image: redpandadata/redpanda:v26.2.6
    container_name: dvw-init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    # --if-not-exists makes creation idempotent. We then assert the partition
    # count, because "already exists" would silently accept a topic that was
    # created earlier with the wrong layout (keys are MMSI; partitioning matters).
    command:
      - |
        export RPK_BROKERS=redpanda:9092
        TOPICS="ais.raw ais.enriched ais.tracks ais.alerts ais.dlq ais.dedup_counts"
        rpk topic create $$TOPICS --partitions 6 --replicas 1 --if-not-exists
        for t in $$TOPICS; do
          n=$$(rpk topic describe "$$t" --print-partitions | tail -n +2 | grep -c .)
          if [ "$$n" -ne 6 ]; then
            echo "ERROR: $$t has $$n partitions, expected 6" >&2; exit 1
          fi
        done
        rpk topic list
    restart: "no"

  console:
    image: redpandadata/console:v3.13.1
    container_name: dvw-console
    profiles: [console]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/admin/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    container_name: dvw-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DB: dvw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native TCP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    # ClickHouse sizes its own caches from this (max_server_memory_usage = 90% of it).
    mem_limit: 1280m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # postgis/postgis publishes amd64 only; runs under Rosetta on Apple Silicon
    container_name: dvw-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      # Mounted as a single file so the image's own 10_postgis.sh is not hidden.
      # initdb scripts only run when the data volume is empty.
      - ./postgis-init/20-extensions.sql:/docker-entrypoint-initdb.d/20-extensions.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ais.raw -> dvw.ais_raw (sinks/clickhouse, docs/adr/0003). Commits offsets only
  # after the insert succeeds; redeliveries collapse on (kafka_partition, kafka_offset).
  # Needs the table: run `make migrate` first (`make up` does).
  raw-sink:
    build:
      context: ../..
      dockerfile: sinks/Dockerfile
    image: dvw-sinks:0.3.0
    container_name: dvw-raw-sink
    command: ["raw"]
    depends_on:
      init-topics:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment: &sink-env
      REDPANDA_BROKERS: redpanda:9092   # internal listener
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    # 50k-row batches plus a 16 MB librdkafka prefetch buffer; see README for measured usage.
    mem_limit: 384m
    # Long enough to insert and commit an in-flight batch, including a retry or two.
    stop_grace_period: 30s
    restart: unless-stopped

  # ais.alerts -> dvw.alerts: same image and delivery code as raw-sink, another SinkSpec
  # (sinks/clickhouse/specs.py, docs/adr/0006). Resent alerts collapse on alert_id.
  alerts-sink:
    build:
      context: ../..
      dockerfile: sinks/Dockerfile
    image: dvw-sinks:0.3.0
    container_name: dvw-alerts-sink
    command: ["alerts"]
    depends_on:
      init-topics:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment: *sink-env
    # Batches of at most 10k small rows; the 16 MB prefetch buffer dominates.
    mem_limit: 192m
    stop_grace_period: 30s
    restart: unless-stopped

  # ais.tracks -> vessels_current in PostGIS (sinks/postgis_vessels, docs/adr/0012). Same
  # image and delivery loop as the ClickHouse sinks. Offsets are committed after the upsert
  # transaction commits; a row only moves to a later event_ts, so replays write nothing.
  # Needs the table: run `make migrate-postgis` first (`make up` does).
  vessels-sink:
    build:
      context: ../..
      dockerfile: sinks/Dockerfile
    image: dvw-sinks:0.3.0
    container_name: dvw-vessels-sink
    entrypoint: ["python", "-m", "sinks.postgis_vessels"]
    command: []
    depends_on:
      init-topics:
        condition: service_completed_successfully
      postgis:
        condition: service_healthy
    environment:
      REDPANDA_BROKERS: redpanda:9092   # internal listener
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    # Batches of at most 10k small rows; the 16 MB prefetch buffer dominates.
    mem_limit: 192m
    stop_grace_period: 30s
    restart: unless-stopped

  # ais.raw -> per-MMSI Kalman filter -> ais.tracks (stream/faust_app, docs/adr/0004).
  # At-least-once; vessel state lives in the dvw-tracker-vessel_state-changelog topic,
  # with a local RocksDB copy in tracker-data. `make nuke` drops both together.
  tracker:
    build:
      context: ../..
      dockerfile: stream/faust_app/Dockerfile
    image: dvw-tracker:0.1.0
    container_name: dvw-tracker
    depends_on:
      init-topics:
        condition: service_completed_successfully
    environment:
      REDPANDA_BROKERS: redpanda:9092   # internal listener
      # ais.enriched needs the Flink job (make flink-up); ais.raw tracks without it,
      # but raises no DARK_GAP (no zone tags).
      TRACKER_INPUT_TOPIC: ${TRACKER_INPUT_TOPIC:-ais.enriched}
    volumes:
      - tracker-data:/data
    # Python + numpy + 6 small RocksDB instances (8 MB block cache each, see app.py).
    mem_limit: 512m
    # Long enough to finish the in-flight batch, flush the producer and commit.
    stop_grace_period: 30s
    restart: unless-stopped

  # Flink session cluster for the enrichment job (flink/enrichment, docs/adr/0014, 0015).
  # One JobManager (coordinates, checkpoints) and one TaskManager (runs the 4 parallel
  # subtasks in its 4 slots). The job itself is submitted by flink-submit. Checkpoints and
  # savepoints go to the flink-data volume, which both must see at the same path.
  flink-jobmanager:
    build:
      context: ../../flink/enrichment
    image: dvw-flink:0.1.0
    container_name: dvw-flink-jobmanager
    profiles: [flink]
    command: ["jobmanager"]
    environment:
      FLINK_PROPERTIES: &flink-properties |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1280m
        taskmanager.memory.managed.fraction: 0.1
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: hashmap
        state.checkpoints.dir: file:///flink-data/checkpoints
        state.savepoints.dir: file:///flink-data/savepoints
        state.checkpoints.num-retained: 3
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 2147483647
        restart-strategy.fixed-delay.delay: 5 s
        heartbeat.timeout: 20000
    ports:
      - "8081:8081"   # web UI and REST API
    volumes:
      - flink-data:/flink-data
    # Equal to jobmanager.memory.process.size: Flink budgets heap, metaspace and JVM
    # overhead inside it, so the container limit is the process size.
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/overview >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: ../../flink/enrichment
    image: dvw-flink:0.1.0
    container_name: dvw-flink-taskmanager
    profiles: [flink]
    command: ["taskmanager"]
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-data:/flink-data
    # Equal to taskmanager.memory.process.size. Heap state, so managed memory (for RocksDB
    # and batch sorting) is cut to 10% and the task heap gets the rest (~410 MB).
    mem_limit: 1280m
    restart: unless-stopped

  # Submits the enrichment job (or reports it is already running), then exits. Also runs
  # stop-with-savepoint and restart for the Makefile; see flink/enrichment/docker/flinkctl.sh.
  # The job reads KAFKA_BROKERS, AIS_DAY and the POSTGRES_* settings from this container's
  # environment at submit time. Before submitting it waits until PostGIS has an active
  # zone package (the startup gate, docs/adr/0018); the job's zone source then reads that
  # package with the same settings, which travel inside the job graph.
  flink-submit:
    build:
      context: ../../flink/enrichment
    image: dvw-flink:0.1.0
    container_name: dvw-flink-submit
    profiles: [flink]
    entrypoint: ["/opt/dvw/flinkctl.sh"]
    command: ["submit"]
    depends_on:
      init-topics:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      postgis:
        condition: service_healthy
    environment:
      FLINK_JOBMANAGER: flink-jobmanager:8081
      KAFKA_BROKERS: redpanda:9092   # internal listener
      AIS_DAY: ${AIS_DAY:?set in .env}
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - flink-data:/flink-data
    # The flink CLI is a JVM that builds the job graph and uploads the jar.
    mem_limit: 384m
    restart: "no"

  # GDAL + minisign for the zone package (refdata/build.py, docs/adr/0011). Not a
  # service: refdata/tools.py starts it with `compose run` for each ogr2ogr or minisign
  # call, mounting only the directories that call needs. No network at all, so the
  # build provably uses nothing but the pinned files in data/refdata/incoming.
  refdata-tools:
    build:
      context: ../../refdata/tools
    image: dvw-refdata-tools:0.1.0
    profiles: [tools]
    network_mode: none
    # ogr2ogr streams features; the largest WDPA polygons clipped with GEOS dominate.
    mem_limit: 1g

volumes:
  flink-data:
  redpanda-data:
  clickhouse-data:
  postgis-data:
  tracker-data:
