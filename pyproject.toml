[project]
name = "dark-vessel-watch"
version = "0.1.0"
description = "Self-hosted streaming pipeline that detects suspicious ship behaviour from AIS data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "types-pyyaml>=6.0.12.20261030",
]
